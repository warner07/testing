<body>
    <script>
        function bsolution(n) {
            let string = "";
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    if (i === 0 || i === n - 1 || j == n - 1 || j == 0) {
                        string += "1";

                    }
                    else {
                        string += " ";
                    }

                }
                string += "\n";

            }

            console.log(string);
        }

        // bsolution(10);

        function hollow(n) {
            
            for (let i = 1; i <= n; i++) {
                let str = ''
                for (let j = 1; j <= 2 * n - 1; ++j) {
                    if (i + j == n + 1 || (i + n == j + 1) || i == n)
                        str += '* ';
                    else
                        str += '  ';
                }
                console.log(str);
            }

        }




        hollow(5);
    </script>
